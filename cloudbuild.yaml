# Google Cloud Build configuration for 24/7 Cloud Run deployment
steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/iitkgp-bs-portal:$COMMIT_SHA', '.']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iitkgp-bs-portal:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with 24/7 min-instances
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iitkgp-bs-portal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iitkgp-bs-portal:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/iitkgp-bs-portal:$COMMIT_SHA'
